podcast:
  title: "Daily Personal Podcast"
  description: "Curated daily briefing, generated for one listener."
  author: "Your Name"
  language: en-US
  base_url: "https://example.local/daily-personal-podcast/"

show:
  target_total_minutes: 22
  # The show is a two-host conversation. Aaron drives (opens, transitions,
  # asks the obvious questions, closes). Emily delivers the information
  # (brings the facts, sources, depth). The 'narrator' slot is retained
  # for backward compatibility but is not used in the prompt — its voice
  # falls back to host_a's voice for safety.
  narrator:
    name: "Aaron"
    persona: "(legacy slot — same as host_a)"
  host_a:
    name: "Aaron"
    persona: "Drives the show — opens with the cold open, leads transitions between segments, asks the obvious follow-up questions, keeps the pace moving."
  host_b:
    name: "Emily"
    persona: "Brings the information — delivers the facts, names the sources, adds the analysis and depth. Reacts to Aaron with energy when something genuinely matters."

research:
  parallel: true
  max_segments_concurrent: 4
  per_segment_timeout_seconds: 600

tts:
  provider: elevenlabs
  cache: true
  voices:
    # Aaron's voice doubles for the legacy 'narrator' slot so any leftover
    # NARRATOR-tagged lines synth cleanly.
    narrator: "D9Thk1W7FRMgiOhy3zVI"
    host_a:   "D9Thk1W7FRMgiOhy3zVI"   # Aaron
    host_b:   "DXFkLCBUTmvXpp2QwZjA"   # Emily
  options:
    elevenlabs:
      model: eleven_turbo_v2_5
      stability: 0.5
      similarity_boost: 0.75

# Sound effects / mild music cues. Generated once via the ElevenLabs
# sound-effects API and cached in assets/sfx/. Set enabled: false to skip.
sfx:
  enabled: true
  show_open:
    prompt: "short cinematic news-show open sting, electronic, gentle, rising, 3 seconds, no vocals"
    duration_seconds: 3.0
  segment_break:
    prompt: "subtle quick whoosh transition stinger, electronic, neutral mood, 1 second"
    duration_seconds: 1.0
  show_close:
    prompt: "warm short outro chord tail, soft synth, 2 seconds, no vocals, fade out"
    duration_seconds: 2.0

publish:
  output_dir: public
  recent_window_days: 7
  segment_history_token_cap: 1500
  recent_digest_word_cap: 500
