podcast:
  title: "Daily Personal Podcast"
  description: "Curated daily briefing, generated for one listener."
  author: "Your Name"
  language: en-US
  base_url: "https://example.local/daily-personal-podcast/"

show:
  target_total_minutes: 5
  narrator:
    name: "Claire"
    persona: "Calm, concise daily briefer."
  host_a:
    name: "Sam"
    persona: "Curious, asks the obvious follow-up."
  host_b:
    name: "Jordan"
    persona: "Skeptical, pushes for what's actually new."

research:
  parallel: true
  max_segments_concurrent: 4
  per_segment_timeout_seconds: 180

tts:
  provider: elevenlabs
  cache: true
  voices:
    narrator: "4CrZuIW9am7gYAxgo2Af"
    host_a:   "qSeXEcewz7tA0Q0qk9fH"
    host_b:   "auq43ws1oslv0tO4BDa7"
  options:
    elevenlabs:
      model: eleven_turbo_v2_5
      stability: 0.5
      similarity_boost: 0.75

publish:
  output_dir: docs
  recent_window_days: 7
  segment_history_token_cap: 1500
  recent_digest_word_cap: 500
