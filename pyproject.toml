[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "daily-personal-podcast"
version = "0.1.0"
description = "Personal daily podcast generator"
requires-python = ">=3.11"
dependencies = [
  "claude-agent-sdk>=0.1.0",
  "pydub>=0.25.1",
  "elevenlabs>=1.0.0",
  "openai>=1.30.0",
  "edge-tts>=6.1.0",
  "feedgen>=1.0.0",
  "Jinja2>=3.1.0",
  "PyYAML>=6.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
